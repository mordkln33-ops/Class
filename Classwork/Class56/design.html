<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: grid;
            grid-template-columns: 150px 50px 50px 150px;
            grid-template-rows: 150px 50px 50px 150px;
        }
        div:nth-child(1){
            background-color: red;
            grid-column:2/4;
            grid-row: 1;
        }
        div:nth-child(2){
            background-color: purple;
            grid-column: 4;
            grid-row: 2/4;
        }
        div:nth-child(3){
            background-color: brown;
            grid-column: 2/4;
            grid-row: 4/5;
        }
        div:nth-child(4){
            background-color: green;
            grid-column: 1;
            grid-row: 2/4;
        }
        div:nth-child(5){
            background-color: red;
            grid-column: 2/3;
            grid-row: 2/3;
        }
        div:nth-child(6){
            background-color: purple;
            grid-column: 3;
            grid-row: 2/3;
        }
        div:nth-child(7){
            background-color: brown;
            grid-column: 3/4;
            grid-row: 2/3;

        }
        div:nth-child(8){
            background-color: green;
        }
        div{
            display: inline-block;
        }
    </style>
</head>
<body>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
</body>
</html>
