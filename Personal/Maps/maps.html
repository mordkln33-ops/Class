<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Map Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="maps.css" />
</head>

<body>
    <div class="mapDiv">
        <div class="toolbar">
            <div class="brand">
                <span class="brandIcon">&#x1F4CD;</span>
                <span class="brandName">Wiki Map Explorer</span>
            </div>
            <div class="searchDiv">
                <input type="text" id="search" placeholder="Search a place, landmark or topic..." autocomplete="off">
                <button id="submitButton">Go!</button>
            </div>
            <div class="searchDiv2">
                <select id="savedLocations">
                    <option hidden>Select a Location</option>
                </select>
                <button id="clearButton">Clear All</button>
            </div>
        </div>
        <div id="sideBar">
            <ol id="sideList"></ol>
        </div>
        <div class="map" id="map">
        </div>
    </div>

    <script>
        (g => { var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary", q = "__ib__", m = document, b = window; b = b[c] || (b[c] = {}); var d = b.maps || (b.maps = {}), r = new Set, e = new URLSearchParams, u = () => h || (h = new Promise(/*async*/(f, n) => {/*await*/ (a = m.createElement("script")); e.set("libraries", [...r] + ""); for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]); e.set("callback", c + ".maps." + q); a.src = `https://maps.${c}apis.com/maps/api/js?` + e; d[q] = f; a.onerror = () => h = n(Error(p + " could not load.")); a.nonce = m.querySelector("script[nonce]")?.nonce || ""; m.head.append(a) })); d[l] ? console.warn(p + " only loads once. Ignoring:", g) : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)) })({

            v: "weekly",

            // Add other bootstrap parameters as needed, using camel case.
        });
    </script>
    <script src="maps.js" type="module"></script>
</body>

</html>
