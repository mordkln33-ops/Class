<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bouncy.css">
    <title>Document</title>
</head>

<body>
    <div class="buttonsDiv" id="buttonsDiv">
        <div>
            <label for="colorPicker">Color:</label>
            <input type="color" name="colorPicker" id="colorPicker">
        </div>
        <div>
            <label for="size">Radius:</label>
            <input type="number" name="size" id="size">
        </div>
        <div>
            <label for="xCoord">Starting X:</label>
            <input type="number" name="xCoord" id="xCoord">
        </div>
        <div>
            <label for="yCoord">Starting Y:</label>
            <input type="number" name="yCoord" id="yCoord">
        </div>
        <div>
            <label for="speed">Speed:</label>
            <input type="number" name="speed" id="speed">
        </div>
        <div>
            <label for="angle">Angle:</label>
            <input type="number" min="1" max="90" name="angle" id="angle" placeholder="1-90">
        </div>
        <button id="addBall">Add a Ball</button>
        <button id="clearBalls">Clear</button>
    </div>
    <div id="bouncyBalls">
        <canvas id="draw"></canvas>
    </div>
    <script src="bouncy.js"></script>
</body>

</html>
